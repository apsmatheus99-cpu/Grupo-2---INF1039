{% load static %}

<link rel="stylesheet" href="{% static 'css/modal_denuncia.css' %}">

<div id="modal-denuncia">
    <div class="container-modal">

        <button type="button" id="fechar-modal-denuncia"class="fechar-modal"aria-label="Fechar janela">&times;</button>
        <h2>Denúncia</h2>
        <p>Informe o motivo pelo qual você deseja denunciar este material.</p>

        <form method="POST" action="{% url 'salvar_denuncia' %}">
            {% csrf_token %}

            <input type="hidden" name="material_id" value="{{ material.id }}">
            <label for="motivo-denuncia">Motivo da denúncia:</label>
            <textarea id="motivo-denuncia" name="descricao" placeholder="Descreva aqui o motivo da denúncia..." required></textarea>
            <button type="submit">Enviar denúncia</button>
        </form>

    </div>
</div>

<script src="{% static 'javascript/modal_denuncia.js' %}"></script>
