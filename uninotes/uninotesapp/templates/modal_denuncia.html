<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denúncia</title>
    <link rel="stylesheet" href="../static/css/modal_denuncia.css">
</head>
<body>
    <main class = "container">
        <h2>Denúncia</h2>
        <H4>Descreva o motivo da sua denúncia:</H4>
        <form method="POST" action="{% url 'salvar_denuncia' %}">
    {% csrf_token %}

    <input type="hidden" name="material_id" value="{{ material.id }}">

    <textarea name="descricao" placeholder="Descreva a denúncia..."required></textarea>

    <button type="submit">Enviar denúncia</button>
</form>
        <div class = "botao">
            <button type="submit">Enviar</button>
        </div>

    </main>
</body>
</html>
