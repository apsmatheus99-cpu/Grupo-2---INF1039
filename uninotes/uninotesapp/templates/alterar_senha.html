<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar senha</title>
</head>
<body>

    <div class="alterar-senha">

        <h2>Alterar senha</h2>
        <p>Atualize sua senha para manter sua conta protegida.</p>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            <div class="campo">
                <label for="senha_atual">Senha atual:</label>
                <input type="password" id="senha_atual" name="senha_atual"
                    placeholder="Digite sua senha atual" required>
            </div>

            <div class="campo">
                <label for="nova_senha">Nova senha:</label>
                <input type="password" id="nova_senha" name="nova_senha"
                    placeholder="Digite sua nova senha" required>
            </div>

            <div class="campo">
                <label for="confirmar_senha">Repita a nova senha:</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha"
                    placeholder="Repita sua nova senha" required>
            </div>

            <div class="botoes">
                <button type="submit">Salvar alterações</button>
                <button type="button">Cancelar</button>
            </div>

        </form>

    </div>

</body>
</html>
