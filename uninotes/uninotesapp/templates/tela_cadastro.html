<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/tela_cadastro.css">
    <link rel="stylesheet" href="../static/css/responsivo.css">
    <title> Uninotes - Cadastro </title>
</head>
<body>
    <main class = "container">
    <div class= "cadastro">
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        <form method="post" action="{% url 'cadastro_usuario' %}">
        {% csrf_token %}
            <div class=" form- header"> 
                <div class = "title"> </div>
                <h1> CRIAR CONTA </h1>
                <h4> Monte seu perfil acadêmico em poucos passos. </h4>
                
            </div>
            

            <div class = "input-group"> 
                <div class = "input-box">
                    <label for = "  name"> Nome completo </label>
                    <input id = "name" type = "text" name="name" required> 
                </div>

              <div class = "input-box">
                    <label for = " email"> E-mail </label>
                    <input id = "email" type = "email" name="email" required> 
                </div>

                  <div class = "input-box">
                    <label for = " faculdade "> Intituição </label>
                    <select id="faculdade" name="faculdade" required>
                    {% for faculdade in faculdades %}
                        <option value="{{ faculdade.id }}">
                            {{ faculdade.name }}
                        </option>
                    {% endfor %}             
                                
                </select>


                </div>

                  <div class = "input-box">
                    <label for = " curso "> Curso </label>
                    
                    <select id="curso" name="curso" required>
                    {% for curso in cursos %}
                        <option value="{{ curso.id }}">
                            {{ curso.name }}
                        </option>
                    {% endfor %}
                   </select>
                </div>


                <div class = "input-box">
                    <label for = " periodo "> Período </label>
                    <input id = "periodo" type = "text" name="periodo" placeholder="Ex.: 5" required> 
                </div>
                

                <div class = "input-box">
                    <label for = " password "> Senha </label>
                    <input id = "password" type = "password" name="password" required> 
                </div>

                 <div class = "input-box confirmar-senha">
                    <label for = " confirmpassword "> Confirmar senha </label>
                    <input id = "confirmpassword" type = "password" name="confirmpassword" required> 
                </div>

  
                <button type="submit" class="continuar">CONTINUAR</button>
            </div>

            

            <div class = "register-link">
                <p> Já tem conta? <a href="/login/"> Entrar</a> </p>

            </div>
        </form>

    </div>



    </main>

</body>
</html>
