
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar dados pessoais</title>
</head>

<body>

    <div class="modal-editar-dados-pessoais" id="ModalEdiDados">

        <div class="modal-conteudo">

            <div class="modal-cabecalho">
                <h2>Editar Dados Pessoais</h2>
                <a href="{% url 'configuracoes' %}" class="fechar">X</a>
            </div>

            <p>Atualize suas informações abaixo:</p>
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}


            <form action="{% url 'editar_dados' %}" method="POST">
                {% csrf_token %}

                <div class="campo">
                    <label for="nome_completo">Nome Completo:</label>
                    <input type="text" id="nome_completo" name="nome_completo" value="{{ aluno.name }}" placeholder="Digite seu nome completo">
                </div>

                <div class="campo">
                    <label for="curso">Curso:</label>
                    <select id="curso" name="curso">
                        <option value="">Selecione seu curso</option>
                        {% for curso in cursos %}
                            <option value="{{ curso.id }}" {% if curso.id == aluno.curso_id %}selected{% endif %}>
                                {{ curso.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="campo">
                    <label for="instituicao">Instituição:</label>
                    <select id="instituicao" name="instituicao">
                        <option value="">Selecione sua instituição</option>
                        {% for instituicao in instituicoes %}
                            <option value="{{ instituicao.id }}" {% if instituicao.id == aluno.instituicao_id %}selected{% endif %}>
                                {{ instituicao.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="campo">
                    <label for="periodo">Período:</label>
                    <input type="number" id="periodo" name="periodo" min="1" value="{{ aluno.periodo }}" placeholder="Ex: 5">
                </div>

                <div class="campo">
                    <label for="sobre_voce">Sobre Você:</label>
                    <textarea id="sobre_voce" name="sobre_voce" placeholder="Conte um pouco sobre você...">{{ aluno.sobre_voce }}</textarea>
                </div>

                <div class="modal_botoes">
                    <button type="submit" class="salvar">Salvar</button>
                    <a href="{% url 'configuracoes' %}" class="cancelar">Cancelar</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
