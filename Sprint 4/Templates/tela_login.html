<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/tela_login.css">
    <link rel="stylesheet" href="../static/css/responsivo.css">
    <title>Uninotes - Login</title>
</head>
<body>
    <main class = "container">
        <form class="cabecalho">
            <h1>ENTRAR</h1>
            <p>Acesse seus materiais e continue estudando.</p>
            <div class = "input-box">
                <p>E-mail acadêmico</p>
                <input placeholder="voce@universidade.edu.br" type = "email">
                <i class="bx bxs-user"></i>
            </div>
            <div class = "input-box">
                <p>Senha</p>
                <input placeholder="Senha" type="password">
                <i class ="bx bxs-lock-alt"></i>
            </div>

            <div class = "remember-forgot">
            
                <a href="#">Esqueci minha senha</a>
            </div>
            
            <a href="telaInicio.html" type="submit" class="entrar">ENTRAR</a>

            <h5 class="separador"> OU</h5>

            <button type="submit" class="continuar">CONTINUAR COM GOOGLE</button>

            <div class = "register-link">
                <p> Ainda não tem conta? <a href="tela_cadastro.html"> Criar conta</a> </p>


            </div>



        </form>


    </main>

</body>
</html>
