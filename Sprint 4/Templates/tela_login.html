<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="tela_login.css">
    <title>Uninotes - Login</title>
</head>
<body>
    <main class = "container">
        <form>
            <h1>ENTRAR</h1>
            <h4>Acesse seus materiais e continue estudando.</h4>
            <div class = "input-box">
                <h4>E-mail acadêmico</h4>
                <input placeholder="voce@universidade.edu.br" type = "email">
                <i class="bx bxs-user"></i>
            </div>
            <div class = "input-box">
                <h4>Senha</h4>
                <input placeholder="Senha" type="password">
                <i class ="bx bxs-lock-alt"></i>
            </div>

            <div class = "remember-forgot">
            
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="entrar">ENTRAR</button>

            <h5 class="separador"> ------------------------------ OU  ------------------------------ </h5>

            <button type="submit" class="continuar">CONTINUAR COM GOOGLE</button>

            <div class = "register-link">
                <p> Ainda não tem conta? <a> Criar conta</a> </p>


            </div>



        </form>


    </main>
</body>
</html>
