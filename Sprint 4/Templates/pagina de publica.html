{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="publicar-pesquisa">
        <a href="{% url 'publicar' %}">PUBLICAR</a>
        <input type="text" placeholder="Buscar por disciplina, matéria, assunto ou professor...">
        <img src="/static/imagens/notificacao.png">
        <img src="/static/imagens/perfil-de-usuario.png">
    </div>


<main>
    <section>
        <p> COMPARTILHE CONHECIMENTO</p>
        <h1>PUBLICAR MATERIAL</h1>
    </section>
    <form action="{% url 'publicar' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% if messages %}
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        {% endif %}


    
    <div>
        <label for="titulo">Titulo do material</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex:Calculo" required>
    </div>

    <div>
        <label for="disciplina">Disciplina</label>
        <input type="text" id="disciplina" name="disciplina" placeholder="Ex:Engenharia de Software" required>
    </div>

    <div>
     <label for="tipo">Tipo de Material</label>
     <select id="tipo" name="tipo" required>
        <option value=""disabled selected>Selecione o tipo</option>
        <option value="resumo">Resumo</option>
        <option value="exerc">Exercício</option>
        <option value="pr">Prova</option>
        <option value="txt">Texto</option>
        <option value="slide">Slide</option>
        <option value="anot">Anotações</option>
    </select>
        </div>

    <div>
        <label for="curso">Curso</label>
        <select id="curso" name="curso">
            <option value="" disabled selected>Selecione o curso</option>
            {% for curso in cursos %}
                <option value="{{ curso.id }}">{{ curso.name }}</option>
            {% endfor %}
    </select>
</div>


<div>
    <label for="instituicao">Instituição</label>
    <select id="instituicao" name="instituicao">
        <option value="" disabled selected>Selecione a instituição</option>
        {% for faculdade in faculdades %}
            <option value="{{ faculdade.id }}">{{ faculdade.name }}</option>
        {% endfor %}
    </select>

</div>
    <div>
     <label for="professor">Professor(opcional)</label>
     <input type="text" id="professor" name="professor" placeholder="Ex:Prof. Silva">
     </div>

    <div>
     <label for="descrição">Descrição</label>
     <input type="text" id="descrição" name="descrição" placeholder="Ex: Descrição do material">
     </div>

    <div>
     <label for="tags">Tags</label>
     <input type="text" id="tags" name="tags" placeholder="Ex: #calculointegral #revisão">
     </div>

    <div>
        <label for="arquivo">
            <p>Arraste ou selecione um arquivo</p>
            <p>PDF, DOC, PPTX ou Imagen até 20MB</p>
            <input type="file" id="arquivo" name="arquivo"
                accept=".pdf, .doc, .docx, .pptx, .jpg, .png, .jpeg" required>
     </label>
    </div>
   

    <div>
     <button type="submit">PUBLICAR MATERIAL</button>
    </div>

    </form>
    
</main>
{% endblock %}
