<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/tela_estatistica.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title> Uninotes - Estatistica </title>
</head>

<body>
    <div class="publicar-busca">
        <a> PUBLICAR</a>
        <input type="text" placeholder="Buscar por disciplina, matéria, assunto ou professor...">
        <i class="fa-regular fa-bell"></i>
        <i class="fa-solid fa-user"></i>
    
    </div>

    <section class="barra-lateral">
        <div class="logo">
            <img src="Logo Uninotes.png">
            <h2><b>UNINOTES</b></h2>
        </div>
        <div class="menu">
            <button>
                <i class="fa-solid fa-house"></i>
                <b>INÍCIO</b></button>
            <button>
                <i class="fa-brands fa-leanpub"></i>
                <b>MEUS MATERIAIS</b></button>
            <button>
                <i class="fa-solid fa-book"></i>
                <b>SALVOS</b></button>
            <button>
                <i class="fa-regular fa-comment"></i>
                <b>MENSAGENS</b></button>
            <button>
                <i class="fa-solid fa-chart-bar"></i>
                <b>ESTATÍSTICAS</b></button>
            <button>
                <i class="fa-solid fa-user"></i>
                <b>PERFIL</b></button>
            <button>
                <i class="fa-solid fa-gear"></i>
                <b>CONFIGURAÇÕES</b></button>
    
        </div>
    </section>

    <div class="estatisticas">
        <h4> SEU IMPACTO NA COMUNIDADE </h4>
        <h1><b> ESTATÍSTICAS</b></h1>
    
     
<div class="grade-estatisticas">

    <div class="box">
        <i class="fa-brands fa-leanpub"></i>
        <div class="textos">
            <p>MATERIAIS PUBLICADOS</p>
            <h5>0</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-solid fa-eye"></i>
        <div class="textos">
            <p>VISUALIZAÇÕES</p>
            <h5>0</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-regular fa-circle-down"></i>
        <div class="textos">
            <p>DOWNLOADS</p>
            <h5>0</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-solid fa-book"></i>
        <div class="textos">
            <p>MATERIAIS SALVOS</p>
            <h5>0</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-regular fa-heart"></i>
        <div class="textos">
            <p>AVALIAÇÃO MÉDIA</p>
            <h5>----</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-regular fa-comment"></i>
        <div class="textos">
            <p>COMENTÁRIOS RECEBIDOS</p>
            <h5>0</h5>
        </div>
    </div>

    <div class="box">
        <i class="fa-solid fa-user-plus"></i>
        <div class="textos">
            <p>SEGUIDORES</p>
            <h5>0</h5>
        </div>
    </div>

    

</div>


<div class="grafico-container">

    <div class="grafico-cabecalho">
        <h2>MATERIAIS PUBLICADOS POR MÊS</h2>

    </div>

    <div class="grafico">

        <div class="mes">
            <div class="barra" style="height: 30%;"></div>
            <span>Jan</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 50%;"></div>
            <span>Fev</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 40%;"></div>
            <span>Mar</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 60%;"></div>
            <span>Abr</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 35%;"></div>
            <span>Maio</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 70%;"></div>
            <span>Jun</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 30%;"></div>
            <span>Jul</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 50%;"></div>
            <span>Ago</span>
        </div>
        <div class="mes"> 
            <div class="barra" style="height: 40%;"></div>
            <span>Set</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 80%;"></div>
            <span>Out</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 60%;"></div>
            <span>Nov</span>
        </div>
        <div class="mes">
            <div class="barra" style="height: 90%;"></div>
            <span>Dez</span>
        </div>

    </div>

    </div>
</body>
</html>
